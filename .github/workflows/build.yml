name: Build ObsidianCode

# Daily: if T3 Code has a new stable release, or this repo changed, build its Android app with
# ObsidianCode's changes (prepare.sh). Release tags are T3 Code's tag plus the start of this
# repo's commit, e.g. v0.1.6-1a2b3c4. The build job has no secrets. Signing and publishing wait
# for approval in the "release" environment.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: "Sign and publish after approval (off: build and check only)"
        type: boolean
        default: true
      upstream_tag:
        description: "T3 Code tag to build (blank: latest stable release)"
        type: string
        default: ""

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release: ${{ steps.tag.outputs.release }}
      new: ${{ steps.tag.outputs.new }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.release }}
        run: |
          tag="${UPSTREAM_TAG:-$(gh api repos/pingdotgg/t3code/releases/latest --jq .tag_name)}"
          release="$tag-${GITHUB_SHA:0:7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = "true" ] && gh release view "$release" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: oc
          persist-credentials: false
      # A plain clone: actions/checkout fails on upstream's broken .repos submodule entries.
      - name: Fetch T3 Code
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: git clone --quiet --depth 1 --branch "$TAG" https://github.com/pingdotgg/t3code.git t3
      - id: versions
        working-directory: t3
        run: |
          echo "node=$(jq -r .engines.node package.json)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(jq -r .packageManager package.json | sed 's/^pnpm@//')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Check local notification events
        # Node's built-in TypeScript support runs these without installing dependencies.
        run: node --test oc/test_local_notifications*.ts
      - name: Apply ObsidianCode
        run: oc/prepare.sh t3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: oc/tailscale/go.mod
          cache: false
      # Tailscale inside the app, as a native library for the obsidian-network module. Go checks
      # every module download against go.sum and Go's public checksum database.
      - name: Build Tailscale library
        working-directory: oc/tailscale
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          out="$GITHUB_WORKSPACE/t3/apps/mobile/modules/obsidian-network/android/src/main/jniLibs/arm64-v8a"
          mkdir -p "$out"
          # Leaves out log upload (logtail, netlog) and features the app doesn't use.
          tags=ts_omit_logtail,ts_omit_netlog,ts_omit_clientupdate,ts_omit_cloud,ts_omit_aws,ts_omit_webclient,ts_omit_ssh,ts_omit_taildrop,ts_omit_capture,ts_omit_tap,ts_omit_drive,ts_omit_kube,ts_omit_synology,ts_omit_tpm,ts_omit_posture
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
            CC="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
            CGO_LDFLAGS="-Wl,-z,max-page-size=16384" \
            go build -trimpath -buildmode=c-shared -tags "$tags" -ldflags="-s -w -buildid=" \
            -o "$out/libobsidiantailscale.so" .
          # Use the same target and tags so notices track the dependencies in this build.
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
            CC="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
            go list -deps -json -tags "$tags" . > "$RUNNER_TEMP/tailscale-packages.json"
          python3 ../collect-licenses.py "$GITHUB_WORKSPACE/t3" "$RUNNER_TEMP/tailscale-packages.json" \
            "$GITHUB_WORKSPACE/THIRD-PARTY-NOTICES.txt"
          assets="$GITHUB_WORKSPACE/t3/apps/mobile/modules/obsidian-network/android/src/main/assets/obsidiancode"
          mkdir -p "$assets"
          cp "$GITHUB_WORKSPACE/THIRD-PARTY-NOTICES.txt" "$assets/"
          rm "$out/libobsidiantailscale.h"
          ls -l "$out"
      - name: Install
        working-directory: t3
        env:
          PNPM_VERSION: ${{ steps.versions.outputs.pnpm }}
        run: |
          # npm checks the download against the registry's checksum; pnpm needs no install scripts.
          npm install -g --ignore-scripts "pnpm@$PNPM_VERSION"
          pnpm install --frozen-lockfile --filter=@t3tools/mobile...
      - name: Build
        working-directory: t3/apps/mobile
        env:
          APP_VARIANT: production
          EXPO_NO_TELEMETRY: "1"
          OBSIDIANCODE_VERSION_CODE: ${{ github.run_number }}
        run: |
          pnpm exec expo prebuild --platform android --no-install
          cd android
          ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > "$GITHUB_WORKSPACE/dependencies.txt"
          # Release builds are signed with Expo's debug key here; the release job replaces the signature.
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ObsidianCode.apk"
      - name: Check the APK
        run: oc/check-apk.sh ObsidianCode.apk THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apk
          path: |
            ObsidianCode.apk
            dependencies.txt
            THIRD-PARTY-NOTICES.txt
          if-no-files-found: ignore
          retention-days: 7

  release:
    needs: [check, build]
    if: github.event_name == 'schedule' || inputs.release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk
      - name: Sign and publish
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.release }}
          T3_TAG: ${{ needs.check.outputs.tag }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > key.p12
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" sign --ks key.p12 --ks-type PKCS12 --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false \
            --out "ObsidianCode-$TAG.apk" ObsidianCode.apk
          rm key.p12
          "$apksigner" verify --print-certs "ObsidianCode-$TAG.apk"
          sha256sum "ObsidianCode-$TAG.apk" > "ObsidianCode-$TAG.apk.sha256"
          gh release create "$TAG" "ObsidianCode-$TAG.apk" "ObsidianCode-$TAG.apk.sha256" THIRD-PARTY-NOTICES.txt -R "$GITHUB_REPOSITORY" \
            --title "ObsidianCode $TAG" --notes "Built from T3 Code $T3_TAG."

  # Build-only runs: a draft release (visible only to the owner, no tag) holds the APK, still
  # signed with Expo's public debug key, so it can be downloaded for emulator tests.
  test-draft:
    needs: [check, build]
    if: github.event_name == 'workflow_dispatch' && !inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk
      - name: Upload as a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: test-${{ needs.check.outputs.release }}-run${{ github.run_number }}
        run: |
          mv ObsidianCode.apk "ObsidianCode-$NAME.apk"
          gh release create "$NAME" "ObsidianCode-$NAME.apk" THIRD-PARTY-NOTICES.txt -R "$GITHUB_REPOSITORY" --draft \
            --title "Test build $NAME (debug-signed, not for phones)" --notes "Build-only run for emulator tests."
