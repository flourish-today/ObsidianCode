plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.getflourish.obsidiancode'
version = '0.0.0'

android {
  namespace 'expo.modules.obsidiannetwork'
  defaultConfig {
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  // Same version react-native-webview 14.0.1 uses.
  implementation 'androidx.webkit:webkit:1.14.0'
}
